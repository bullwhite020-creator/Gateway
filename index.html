<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gorofa Payment</title>
<style>body{font-family:Arial;margin:0;background:#f4f7f7;color:#17202a}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:white;padding:20px;border-radius:16px;margin:14px 0;box-shadow:0 4px 20px #0001}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ddd;margin:5px 0}input,select{width:100%;box-sizing:border-box}button{background:#0f766e;color:white;border:0;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{padding:18px;background:#e8f4f2;border-radius:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{background:#e7eeee;color:#123}.tabs .on{background:#0f766e;color:white}.hide{display:none}.msg{padding:10px;background:#fff1eb;border-radius:9px}.ok{background:#ecfdf3}</style></head>
<body><div id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,getDocs,addDoc,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

/* IMPORTANT: replace these two placeholders with the values from Firebase */
const firebaseConfig={apiKey:"PASTE_FULL_API_KEY_HERE",authDomain:"gorafa-payment.firebaseapp.com",projectId:"gorafa-payment",storageBucket:"gorafa-payment.firebasestorage.app",messagingSenderId:"646663554381",appId:"PASTE_FULL_APP_ID_HERE"};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);let me,workers=[],payments=[];
const A=document.getElementById("app"),esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function login(m=""){A.innerHTML='<div class="wrap"><div class="card"><h1>Gorofa Payment</h1><p>Login</p><input id="e" type="email" placeholder="Email"><input id="p" type="password" maxlength="8" placeholder="Password (6–8 characters)"><button id="b" style="width:100%">Login</button>'+(m?'<p class="msg">'+esc(m)+'</p>':"")+'</div></div>';b.onclick=async()=>{let p=document.getElementById("p").value;if(p.length<6||p.length>8)return login("Password must be 6–8 characters.");try{await signInWithEmailAndPassword(auth,e.value,p)}catch(x){login("Incorrect email or password.")}}}
async function start(){let s=await getDoc(doc(db,"users",auth.currentUser.uid));if(!s.exists())return login("Your account is not registered. Ask the admin.");me={uid:auth.currentUser.uid,...s.data()};await refresh();dashboard()}
async function refresh(){let a=await getDocs(collection(db,"workers"));workers=a.docs.map(d=>({id:d.id,...d.data()}));let b=await getDocs(collection(db,"payments"));payments=b.docs.map(d=>({id:d.id,...d.data()}))}
function shell(t){let tabs=["dashboard","payments","workers"];if(me.role==="admin")tabs.push("members","report");return '<div class="card"><h1>Gorofa Payment</h1><p>Welcome, '+esc(me.name||"Member")+'</p><div class="tabs">'+tabs.map(x=>'<button class="'+(t==x?"on":"")+'" data-t="'+x+'">'+x[0].toUpperCase()+x.slice(1)+'</button>').join("")+'<button id="out">Logout</button></div></div>'}
function bind(){document.querySelectorAll("[data-t]").forEach(x=>x.onclick=()=>go(x.dataset.t));document.getElementById("out").onclick=()=>signOut(auth)}
function dashboard(){A.innerHTML='<div class="wrap">'+shell("dashboard")+'<div class="grid"><div class="stat">Workers<h2>'+workers.length+'</h2></div><div class="stat">Payments<h2>'+payments.length+'</h2></div><div class="stat">Amount<h2>KSh '+payments.reduce((n,p)=>n+Number(p.amount||0),0).toLocaleString()+'</h2></div></div>'+(me.role==="admin"?"":'<div class="card"><h2>11 AM</h2><p>Visible to users only.</p><button id="am">Mark 11 AM</button><span id="ams"></span></div>')+'</div>';bind();if(document.getElementById("am"))am.onclick=async()=>{await addDoc(collection(db,"attendance"),{uid:me.uid,name:me.name,time:"11 AM",date:new Date().toISOString().slice(0,10),createdAt:serverTimestamp()});ams.innerHTML=" ✓ Saved"}}
async function go(t){await refresh();if(t==="dashboard")dashboard();else if(t==="payments")pay();else if(t==="workers")worker();else if(t==="members")members();else report()}
function pay(){A.innerHTML='<div class="wrap">'+shell("payments")+'<div class="card"><h2>Add payment</h2><select id="pw"><option value="">Select worker</option>'+workers.map(w=>'<option value="'+w.id+'">'+esc(w.name)+' ('+esc(w.number||"") +')</option>').join("")+'</select><input id="amt" type="number" placeholder="Amount (KSh)"><input id="wn" placeholder="Work number"><input id="dt" type="date" value="'+new Date().toISOString().slice(0,10)+'"><button id="save">Save payment</button><p id="pm"></p></div><div class="card"><h2>Payments</h2><table width="100%"><tr><th>Date</th><th>Worker</th><th>Work no.</th><th>Amount</th></tr>'+payments.map(p=>'<tr><td>'+esc(p.date)+'</td><td>'+esc(p.workerName)+'</td><td>'+esc(p.workNumber)+'</td><td>KSh '+Number(p.amount||0).toLocaleString()+'</td></tr>').join("")+'</table></div></div>';bind();save.onclick=async()=>{let w=workers.find(x=>x.id===pw.value),a=Number(amt.value);if(!w||!a)return pm.innerText="Select worker and amount.";await addDoc(collection(db,"payments"),{workerId:w.id,workerName:w.name,workNumber:wn.value||w.number||"",amount:a,date:dt.value,createdBy:me.uid,createdAt:serverTimestamp()});pay()}}
function worker(){let admin=me.role==="admin";A.innerHTML='<div class="wrap">'+shell("workers")+(admin?'<div class="card"><h2>Add worker</h2><input id="n" placeholder="Worker name"><input id="num" placeholder="Worker number"><button id="add">Add worker</button></div>':"")+'<div class="card"><h2>Workers</h2>'+workers.map(w=>'<p><b>'+esc(w.name)+'</b> — '+esc(w.number||"")+(admin?' <button onclick="editW(\''+w.id+'\')">Edit</button> <button onclick="delW(\''+w.id+'\')">Delete</button>':"")+'</p>').join("")+'</div></div>';bind();if(admin)add.onclick=async()=>{if(n.value.trim()){await addDoc(collection(db,"workers"),{name:n.value.trim(),number:num.value.trim(),createdBy:me.uid,createdAt:serverTimestamp()});worker()}}}
window.editW=async id=>{let w=workers.find(x=>x.id===id),n=prompt("Worker name",w.name),num=prompt("Worker number",w.number||"");if(n!==null&&num!==null){await updateDoc(doc(db,"workers",id),{name:n,number:num});worker()}}
window.delW=async id=>{if(confirm("Delete worker?")){await deleteDoc(doc(db,"workers",id));worker()}}
function members(){A.innerHTML='<div class="wrap">'+shell("members")+'<div class="card"><h2>Members</h2><p>Member creation is handled from Firebase Authentication. Create each user there, then add their profile in Firestore users collection with role <b>user</b> or <b>admin</b>.</p></div></div>';bind()}
function report(){let csv=[["Date","Worker","Work Number","Amount"],...payments.map(p=>[p.date,p.workerName,p.workNumber,p.amount])].map(r=>r.map(x=>'"'+String(x??"").replaceAll('"','""')+'"').join(",")).join("\n");A.innerHTML='<div class="wrap">'+shell("report")+'<div class="card"><h2>Payment report</h2><p>Total: KSh '+payments.reduce((n,p)=>n+Number(p.amount||0),0).toLocaleString()+'</p><button id="down">Download report</button></div></div>';bind();down.onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="gorofa-payment-report.csv";a.click()}}
onAuthStateChanged(auth,u=>u?start():login());
</script></body></html>
